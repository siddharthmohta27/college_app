<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark glassmorphic background container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="12" stroke-opacity="0.6"/>
  
  <!-- Subtle inner background glow -->
  <circle cx="256" cy="230" r="140" fill="url(#glowGrad)"/>

  <!-- Graduation Cap / Campus Connect Emblem -->
  <g filter="url(#glow)">
    <!-- Cap Top Diamond -->
    <path d="M 256 120 L 416 195 L 256 270 L 96 195 Z" fill="url(#primaryGrad)" />
    
    <!-- Cap Under Base -->
    <path d="M 160 235 L 160 305 C 160 345, 352 345, 352 305 L 352 235 C 320 260, 192 260, 160 235 Z" fill="url(#primaryGrad)" opacity="0.95" />
    
    <!-- Tassel -->
    <path d="M 400 200 L 400 310 C 400 330, 420 340, 420 340" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" fill="none" />
    <circle cx="420" cy="345" r="14" fill="#FACC15"/>
  </g>

  <!-- Small accent spark / star -->
  <path d="M 370 120 Q 385 120 385 105 Q 385 120 400 120 Q 385 120 385 135 Q 385 120 370 120 Z" fill="#FACC15"/>
</svg>
